<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>website login form</title>

    <style>
          body {
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:url('g.jpg'); 
            margin: 0;
            padding: 0;
                    
          }
          @keyframes popup{
            from{
                opacity: 0;
                transform: translateY(30px);
            }
            to{
                opacity: 1;
                transform: translateY(0) scale(1);
            }
          }

          .login-box {
            width: 380px;
            padding: 35px;
            margin-top: 90px;
            background: transparent;
            border: 4px double #8b7cf6;
            box-shadow: 0 15px rgba (79, 124, 255,.2);
            text-align: center;
            animation: popup .8s ease;
            color:white;
          }

          .login-box h1{
            color: white;
            margin-bottom: 8px;
            font-size: 35px;
          }
          
          .login p{
            color: white;
            font-weight: bold;
            font-size: 25px;
          }

          .input-box{
            text-align: left;
            margin-bottom: 18px;
          }

          .login-box input{
            width: 93%;
            padding: 12px;
            margin-top: 7px;
            border: 2px solid #d9dfff;
            border-radius: 10px;
            outline: none;
          }

          .login-box input:focus {
            color: #0f0a33;
          }

          .login-box button {
            margin-top: 15px;
            background: #4f7cff;
            color: white;
            border: 2px solid #d9dfff;
            border-radius: 10px;
            transition: .3s;
            width: 100%;
            padding: 12px; 
            cursor: pointer;
          }

          .login-btn hover{
            background: #8b7cf6;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(139, 124, 246, .3);
          }
    </style>
</head>
<body>
    <div class="login-box">

        <h1>WELCOME</h1>

        <p>PLEASE TO CONTINUE TO LOGIN</p>

       <form onsubmit="login(event)">
        <input type="text"
        id="username" placeholder="username" required>

        <input type="text"
        id="password" placeholder="password" required>

        <button type="submit">Login</button>
        </form>
        </div>
        <script>
          function login(event) {
            event.preventDefault();

            let username= document.getElementById("username").value;
            let password= document.getElementById("password").value;
            if (username === "admin" && password === "12345") {
              window.location.href = "homepage.html";
            }else{
              alert("wrong username or password");
            }
          }
        </script>
</body>
</html>
